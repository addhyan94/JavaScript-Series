<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project - ColorChange</title>
    <style>
        body{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items:center ;
        }
        .button{
            margin: 1rem;
            border: 2px solid black;
            background-color: orange;
            height: 5em;
            width: 5em;
            cursor: pointer;
        }
        .boxes{
            display: flex;
            flex-wrap: wrap;
        }
        .backbtn{
            background-color: rgb(165, 138, 191);
            height: 2em;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .backbtn a{
            color: black;
            font-size: larger;
            font-weight: bolder;
        }
    </style>
</head>

<body>
    <div class="backbtn"><a style="text-decoration: none;" href="../Project-Home.html">↩ - Back To Home </a></div>
    <h1 class="text">Color Scheme Switcher </h1>
    <div class="boxes">
    <div class="button" id="yellow"></div>
    <div class="button" id="gray"></div>
    <div class="button" id="blue"></div>
    <div class="button" id="orange"></div>
    </div>
    <h2 class="textdown">Try Clicking on one of the colors above <br> To change the background color of this Page !!!</h2>
    <script>

        const colorchanger = ((id, colorname) =>{
            let ID = document.querySelector(id)
           ID.style.backgroundColor = colorname
        });

        colorchanger('#yellow','yellow');
        colorchanger('#gray','gray');
        colorchanger('#blue','blue');

        let buttons = document.querySelectorAll('.button')
        const body = document.querySelector("body")

        buttons.forEach(button =>{
            button.addEventListener('click',e =>{

                // This is a Second Methord For change Background color ...
                if (e.target.id === 'yellow') {
                    body.style.backgroundColor = e.target.id
                    body.style.color = 'black'
                }
                else if (e.target.id === 'gray') {
                    body.style.backgroundColor = e.target.id
                    body.style.color = 'black'
                }
               else if (e.target.id === 'blue') {
                    body.style.backgroundColor = e.target.id
                    body.style.color = 'white'
                }
                else if (e.target.id === 'orange') {
                    body.style.backgroundColor = e.target.id
                    body.style.color = 'black'
                }
                

              /*  // First methord is switch :::: 
                switch (e.target) {
                    case yellow:
                        body.style.backgroundColor ='yellow'
                        body.style.color ='black'
                        console.log("yellow Clicked");
                        break;
                    case gray:
                        body.style.backgroundColor ='gray'
                        console.log("gray Clicked");
                        break;
                    case blue:
                        body.style.backgroundColor ='blue'
                        body.style.color ='white'
                        console.log("blue Clicked");
                        break;
                    case orange:
                        body.style.backgroundColor ='orange'
                        body.style.color ='black'
                        console.log("orange Clicked");
                        break;
                    default:
                        body.style.backgroundColor ='white'
                        break;
                } */

            })
        })
        
    </script>
</body>

</html>
